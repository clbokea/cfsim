# Documentation site, published to https://clbokea.github.io/cfsim/ by
# .github/workflows/docs.yml. Preview locally: uv run --group docs mkdocs serve
site_name: cfsim
site_description: A lightweight Crazyflie simulator for the classroom
site_url: https://clbokea.github.io/cfsim/
repo_url: https://github.com/clbokea/cfsim
repo_name: clbokea/cfsim
edit_uri: edit/main/docs/

nav:
  - Home: README.md
  - Running scripts: running-scripts.md
  - Developer guide: developer-guide.md
  - Releases: https://github.com/clbokea/cfsim/releases

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Light mode
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  links:
    anchors: warn

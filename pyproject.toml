[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cfsim"
version = "1.0.2"
description = "A lightweight Crazyflie simulator for the classroom: run unchanged cflib scripts on a simulated drone"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["matplotlib>=3.5"]

[tool.setuptools.packages.find]
include = ["cfsim*"]

[tool.setuptools.package-data]
cfsim = ["worlds/*.txt"]
